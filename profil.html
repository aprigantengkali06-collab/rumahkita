<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profil - RumahKita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="bg-gray-50" style="font-family:'Inter',sans-serif;">

<nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><i class="fas fa-home text-white text-sm"></i></div>
      <span class="text-xl font-extrabold text-blue-600">Rumah<span class="text-gray-900">Kita</span></span>
    </a>
    <a href="dashboard.html" class="text-sm text-gray-600 hover:text-blue-600"><i class="fas fa-arrow-left mr-1"></i>Dashboard</a>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-2xl font-extrabold text-gray-900 mb-6">Edit Profil</h1>

  <!-- Alert -->
  <div id="profileAlert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Photo & Stats -->
    <div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center mb-4">
        <div class="relative inline-block mb-4">
          <div id="avatarPreview" class="w-24 h-24 rounded-full bg-blue-600 flex items-center justify-center text-white text-3xl font-bold mx-auto">?</div>
          <button onclick="document.getElementById('avatarInput').click()" class="absolute bottom-0 right-0 w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white hover:bg-blue-700 transition shadow-lg">
            <i class="fas fa-camera text-xs"></i>
          </button>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="previewAvatar(this)">
        </div>
        <h3 id="profileName" class="font-bold text-gray-900">...</h3>
        <p id="profileEmail" class="text-gray-500 text-sm">...</p>
        <div class="mt-3 flex justify-center">
          <span id="profileBadge" class="text-xs px-3 py-1 rounded-full font-semibold bg-blue-50 text-blue-700">Pemilik</span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h4 class="font-semibold text-gray-900 mb-3 text-sm">Statistik Akun</h4>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-gray-500">Bergabung sejak</span><span class="font-medium" id="memberSince">-</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Total Listing</span><span class="font-bold text-blue-600">5</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Total Dilihat</span><span class="font-bold text-blue-600">2.4K</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Rating</span><span class="font-bold text-amber-500">⭐ 4.8</span></div>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="sm:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama Lengkap <span class="text-red-500">*</span></label>
              <input type="text" id="pFullName" required placeholder="Nama lengkap" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
              <input type="email" id="pEmail" readonly class="w-full border border-gray-100 bg-gray-50 rounded-xl px-4 py-3 text-sm text-gray-500 cursor-not-allowed">
              <p class="text-xs text-gray-400 mt-1">Email tidak dapat diubah</p>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nomor HP</label>
              <div class="relative">
                <i class="fas fa-phone absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                <input type="tel" id="pPhone" placeholder="08xxxxxxxxxx" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nomor WhatsApp</label>
              <div class="relative">
                <i class="fab fa-whatsapp absolute left-3.5 top-3.5 text-green-500 text-sm"></i>
                <input type="tel" id="pWhatsapp" placeholder="08xxxxxxxxxx" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Kota</label>
              <div class="relative">
                <i class="fas fa-map-marker-alt absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                <input type="text" id="pCity" placeholder="Kota Anda" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tipe Akun</label>
              <select id="pAccountType" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <option value="pemilik">🏠 Pemilik Properti</option>
                <option value="agen">🤝 Agen Properti</option>
                <option value="developer">🏗️ Developer</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Bio / Tentang Saya</label>
              <textarea id="pBio" rows="4" placeholder="Ceritakan sedikit tentang diri Anda dan pengalaman di bidang properti..." class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </div>
          </div>

          <!-- Password Change Section -->
          <div class="border-t border-gray-100 pt-5">
            <h3 class="font-semibold text-gray-900 mb-4">Ubah Password</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Password Baru</label>
                <input type="password" id="pNewPass" placeholder="Min. 8 karakter" minlength="8" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Konfirmasi Password</label>
                <input type="password" id="pConfirmPass" placeholder="Ulangi password baru" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition flex items-center justify-center gap-2">
              <i class="fas fa-save"></i>Simpan Perubahan
            </button>
            <a href="dashboard.html" class="px-5 py-3 border border-gray-300 text-gray-700 rounded-xl font-semibold text-sm hover:bg-gray-50 transition">Batal</a>
          </div>
        </form>
      </div>

      <!-- Danger Zone -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-red-100 mt-4">
        <h3 class="font-semibold text-red-600 mb-2 text-sm">Zona Berbahaya</h3>
        <p class="text-xs text-gray-500 mb-3">Tindakan berikut tidak dapat dibatalkan</p>
        <button onclick="if(confirm('Yakin ingin menghapus akun? Semua data Anda akan hilang permanen.')) deleteAccount()" class="text-sm text-red-500 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-50 font-medium transition">
          <i class="fas fa-trash-alt mr-1.5"></i>Hapus Akun Saya
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let user = null;
document.addEventListener('DOMContentLoaded', () => {
  user = JSON.parse(localStorage.getItem('rumahkita_user') || 'null');
  if (!user) { window.location.href = 'login.html'; return; }
  
  // Populate fields
  document.getElementById('pFullName').value = user.name || '';
  document.getElementById('pEmail').value = user.email || '';
  document.getElementById('pPhone').value = user.phone || '';
  document.getElementById('pWhatsapp').value = user.whatsapp || '';
  document.getElementById('pCity').value = user.city || '';
  document.getElementById('pBio').value = user.bio || '';
  if (user.type) document.getElementById('pAccountType').value = user.type;
  
  // Update sidebar
  document.getElementById('profileName').textContent = user.name;
  document.getElementById('profileEmail').textContent = user.email;
  document.getElementById('avatarPreview').textContent = user.name.charAt(0).toUpperCase();
  const typeMap = { pemilik:'Pemilik', agen:'Agen', developer:'Developer' };
  document.getElementById('profileBadge').textContent = typeMap[user.type] || 'Pemilik';
  document.getElementById('memberSince').textContent = new Date().toLocaleDateString('id-ID', { month:'long', year:'numeric' });
});

function previewAvatar(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById('avatarPreview');
    preview.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-full">`;
  };
  reader.readAsDataURL(input.files[0]);
}

function saveProfile(e) {
  e.preventDefault();
  const newPass = document.getElementById('pNewPass').value;
  const confirmPass = document.getElementById('pConfirmPass').value;
  if (newPass && newPass !== confirmPass) {
    showAlert('Password baru tidak cocok', 'error');
    return;
  }
  
  const updatedUser = {
    ...user,
    name: document.getElementById('pFullName').value,
    phone: document.getElementById('pPhone').value,
    whatsapp: document.getElementById('pWhatsapp').value,
    city: document.getElementById('pCity').value,
    bio: document.getElementById('pBio').value,
    type: document.getElementById('pAccountType').value,
  };
  localStorage.setItem('rumahkita_user', JSON.stringify(updatedUser));
  showAlert('Profil berhasil disimpan! ✅', 'success');
  setTimeout(() => window.location.href = 'dashboard.html', 1200);
}

function showAlert(msg, type='error') {
  const box = document.getElementById('profileAlert');
  box.className = `mb-4 p-4 rounded-xl text-sm font-medium ${type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200'}`;
  box.textContent = msg;
  box.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteAccount() {
  localStorage.clear();
  window.location.href = 'index.html';
}
</script>
</body>
</html>
