<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - RumahKita</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center" style="font-family:'Inter',sans-serif;">
  <div class="w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-home text-white"></i></div>
        <span class="text-2xl font-extrabold text-blue-600">Rumah<span class="text-gray-900">Kita</span></span>
      </a>
    </div>
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      <div id="step1">
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-lock-open text-blue-600 text-2xl"></i></div>
          <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Lupa Password?</h1>
          <p class="text-gray-500 text-sm">Masukkan email Anda dan kami akan kirimkan link reset password</p>
        </div>
        <div id="resetAlert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>
        <form onsubmit="sendReset(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
              <input type="email" id="resetEmail" required placeholder="nama@email.com" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <button type="submit" id="resetBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <i class="fas fa-paper-plane"></i>Kirim Link Reset
          </button>
        </form>
      </div>
      <div id="step2" class="hidden text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-envelope-open-text text-green-600 text-2xl"></i></div>
        <h2 class="text-xl font-extrabold text-gray-900 mb-2">Email Terkirim!</h2>
        <p class="text-gray-500 text-sm mb-4">Kami telah mengirimkan link reset password ke <strong id="sentEmail" class="text-gray-900"></strong></p>
        <p class="text-gray-400 text-xs">Cek folder spam jika email tidak ditemukan. Link berlaku selama 24 jam.</p>
      </div>
      <p class="text-center text-sm text-gray-500 mt-5">
        <a href="login.html" class="text-blue-600 font-semibold hover:underline"><i class="fas fa-arrow-left mr-1"></i>Kembali ke Halaman Masuk</a>
      </p>
    </div>
  </div>
  <script>
  function sendReset(e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value;
    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Mengirim...';
    setTimeout(() => {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('sentEmail').textContent = email;
    }, 1000);
  }
  </script>
</body>
</html>
