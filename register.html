<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - RumahKita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-8" style="font-family:'Inter',sans-serif;">
  <div class="w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-home text-white"></i></div>
        <span class="text-2xl font-extrabold text-blue-600">Rumah<span class="text-gray-900">Kita</span></span>
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      <h1 class="text-2xl font-extrabold text-gray-900 mb-1 text-center">Daftar Akun Baru</h1>
      <p class="text-gray-500 text-sm text-center mb-6">Gratis selamanya! Mulai pasang iklan properti</p>

      <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

      <!-- Google -->
      <button onclick="registerWithGoogle()" class="w-full flex items-center justify-center gap-3 py-3 border-2 border-gray-200 rounded-xl text-gray-700 font-semibold hover:bg-gray-50 hover:border-gray-300 transition mb-4">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Daftar dengan Google
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 font-medium">atau</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama Lengkap <span class="text-red-500">*</span></label>
          <div class="relative">
            <i class="fas fa-user absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="fullName" required placeholder="Nama lengkap Anda" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email <span class="text-red-500">*</span></label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="email" id="regEmail" required placeholder="nama@email.com" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nomor WhatsApp <span class="text-red-500">*</span></label>
          <div class="relative">
            <i class="fab fa-whatsapp absolute left-3.5 top-3.5 text-green-500 text-sm"></i>
            <input type="tel" id="whatsapp" required placeholder="08xxxxxxxxxx" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password <span class="text-red-500">*</span></label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="password" id="regPassword" required placeholder="Min. 8 karakter" minlength="8" class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="checkPasswordStrength(this.value)">
            <button type="button" onclick="togglePass('regPassword','passIcon')" class="absolute right-3.5 top-3.5 text-gray-400 hover:text-gray-600"><i id="passIcon" class="fas fa-eye text-sm"></i></button>
          </div>
          <div id="passStrength" class="mt-1.5 hidden">
            <div class="flex gap-1 mb-1">
              <div id="s1" class="h-1 flex-1 rounded-full bg-gray-200"></div>
              <div id="s2" class="h-1 flex-1 rounded-full bg-gray-200"></div>
              <div id="s3" class="h-1 flex-1 rounded-full bg-gray-200"></div>
              <div id="s4" class="h-1 flex-1 rounded-full bg-gray-200"></div>
            </div>
            <p id="passStrengthText" class="text-xs"></p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Konfirmasi Password <span class="text-red-500">*</span></label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="password" id="confirmPass" required placeholder="Ulangi password Anda" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <p id="passMatchError" class="text-red-500 text-xs mt-1 hidden">Password tidak cocok</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tipe Akun</label>
          <div class="grid grid-cols-3 gap-2">
            ${[{v:'pemilik',icon:'🏠',label:'Pemilik'},{v:'agen',icon:'🤝',label:'Agen'},{v:'developer',icon:'🏗️',label:'Developer'}].map(t =>
              `<label class="cursor-pointer"><input type="radio" name="accountType" value="${t.v}" ${t.v==='pemilik'?'checked':''} class="hidden peer"><div class="peer-checked:border-blue-500 peer-checked:bg-blue-50 border-2 border-gray-200 rounded-xl p-3 text-center transition hover:border-blue-300"><div class="text-2xl mb-1">${t.icon}</div><div class="text-xs font-semibold text-gray-700">${t.label}</div></div></label>`
            ).join('')}
          </div>
        </div>

        <label class="flex items-start gap-2 cursor-pointer">
          <input type="checkbox" id="agreeTerms" required class="w-4 h-4 mt-0.5 accent-blue-600">
          <span class="text-sm text-gray-600">Saya setuju dengan <a href="syarat.html" class="text-blue-600 hover:underline">Syarat & Ketentuan</a> dan <a href="privasi.html" class="text-blue-600 hover:underline">Kebijakan Privasi</a> RumahKita</span>
        </label>

        <button type="submit" id="regBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition flex items-center justify-center gap-2">
          <i class="fas fa-user-plus"></i>Buat Akun
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-5">
        Sudah punya akun? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Masuk di sini</a>
      </p>
    </div>
  </div>

  <script>
    function togglePass(id, iconId) {
      const el = document.getElementById(id);
      const ic = document.getElementById(iconId);
      if (el.type === 'password') { el.type = 'text'; ic.className = 'fas fa-eye-slash text-sm'; }
      else { el.type = 'password'; ic.className = 'fas fa-eye text-sm'; }
    }

    function checkPasswordStrength(pass) {
      const box = document.getElementById('passStrength');
      box.classList.remove('hidden');
      const strength = [/[a-z]/.test(pass), /[A-Z]/.test(pass), /[0-9]/.test(pass), pass.length >= 8].filter(Boolean).length;
      const colors = ['bg-red-500','bg-orange-500','bg-yellow-500','bg-green-500'];
      const labels = ['Sangat Lemah','Lemah','Sedang','Kuat'];
      const textColors = ['text-red-500','text-orange-500','text-yellow-500','text-green-500'];
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('s'+i);
        el.className = 'h-1 flex-1 rounded-full ' + (i <= strength ? colors[strength-1] : 'bg-gray-200');
      }
      document.getElementById('passStrengthText').className = 'text-xs ' + textColors[strength-1];
      document.getElementById('passStrengthText').textContent = 'Kekuatan: ' + (labels[strength-1] || 'Sangat Lemah');
    }

    function showAlert(msg, type='error') {
      const box = document.getElementById('alertBox');
      box.className = `mb-4 p-3 rounded-xl text-sm font-medium ${type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200'}`;
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('regPassword').value;
      const confirm = document.getElementById('confirmPass').value;
      
      if (pass !== confirm) {
        document.getElementById('passMatchError').classList.remove('hidden');
        return;
      }
      document.getElementById('passMatchError').classList.add('hidden');

      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Membuat akun...';

      const user = {
        id: 'user-' + Date.now(),
        name: document.getElementById('fullName').value,
        email: document.getElementById('regEmail').value,
        whatsapp: document.getElementById('whatsapp').value,
        type: document.querySelector('input[name="accountType"]:checked').value,
      };

      setTimeout(() => {
        localStorage.setItem('rumahkita_user', JSON.stringify(user));
        showAlert('Akun berhasil dibuat! Mengalihkan ke dashboard...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }, 1000);
    }

    function registerWithGoogle() {
      const user = { id: 'user-google-' + Date.now(), name: 'Pengguna Google', email: 'google@gmail.com', type: 'pemilik' };
      localStorage.setItem('rumahkita_user', JSON.stringify(user));
      window.location.href = 'dashboard.html';
    }

    if (localStorage.getItem('rumahkita_user')) window.location.href = 'dashboard.html';
  </script>
</body>
</html>
