<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Properti - RumahKita</title>
  <meta name="description" content="Detail properti lengkap dengan peta dan galeri foto di RumahKita">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-bottom: 140px; }
    @media (min-width: 768px) { body { padding-bottom: 0; } }
    .detail-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) { .detail-layout { grid-template-columns: 1fr 340px; } }
    #map { height: 360px; border-radius: 16px; z-index: 1; }
    @media (min-width: 640px) { #map { height: 420px; } }
    .gallery-grid { display: grid; gap: 6px; border-radius: 16px; overflow: hidden; }
    .gallery-main { height: 280px; overflow: hidden; position: relative; }
    .gallery-main img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: opacity 0.2s; }
    .gallery-main img:hover { opacity: 0.92; }
    @media (min-width: 640px) {
      .gallery-grid { grid-template-columns: 2fr 1fr; grid-template-rows: 250px 250px; }
      .gallery-main { grid-row: span 2; height: auto; }
      .gallery-thumb { display: block !important; height: 100%; overflow: hidden; position: relative; }
      .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: opacity 0.2s; display: block; }
      .gallery-thumb img:hover { opacity: 0.85; }
    }
    .gallery-thumb { display: none; }
    .gallery-more-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .gallery-more-overlay span { color: white; font-size: 18px; font-weight: 800; }
    .spec-box { background: #f9fafb; border-radius: 14px; padding: 16px; text-align: center; }
    .spec-box .icon { font-size: 1.5rem; margin-bottom: 6px; }
    .spec-box .label { font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .spec-box .value { font-size: 16px; font-weight: 800; color: #111827; margin-top: 2px; }
    .feature-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #374151; padding: 6px 0; }
    .agent-card { background: white; border: 1px solid #f3f4f6; border-radius: 16px; padding: 20px; }
    .contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 9999; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .share-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; border: 1.5px solid #e5e7eb; background: white; cursor: pointer; color: #374151; transition: all 0.15s; font-family: inherit; }
    .share-btn:hover { border-color: #2563eb; color: #2563eb; }
    .similar-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 480px) { .similar-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .similar-grid { grid-template-columns: repeat(3, 1fr); } }
    .mobile-contact-bar { position: fixed; bottom: 60px; left: 0; right: 0; background: white; border-top: 1px solid #f3f4f6; padding: 10px 16px; z-index: 200; display: flex; gap: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
    @media (min-width: 768px) { .mobile-contact-bar { display: none !important; } }
  </style>
</head>
<body class="bg-gray-50">

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-logo">
      <div class="navbar-logo-icon"><i class="fas fa-home"></i></div>
      <div class="navbar-logo-text">Rumah<span>Kita</span></div>
    </a>
    <div class="navbar-links">
      <a href="properti.html?listing=dijual">Dijual</a>
      <a href="properti.html?listing=disewa">Disewa</a>
      <a href="kpr.html">KPR</a>
      <a href="artikel.html">Artikel</a>
    </div>
    <div class="navbar-actions" id="navAuthDesktop"></div>
    <button class="nav-hamburger" id="navHamburger"><i class="fas fa-bars"></i></button>
  </div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
  <div class="mobile-menu-drawer">
    <div class="mobile-menu-header">
      <div class="navbar-logo"><div class="navbar-logo-icon"><i class="fas fa-home"></i></div><div class="navbar-logo-text">Rumah<span>Kita</span></div></div>
      <button class="mobile-menu-close" id="mobileMenuClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="mobile-menu-nav">
      <a href="index.html"><i class="fas fa-home" style="color:#2563eb;"></i>Beranda</a>
      <a href="properti.html?listing=dijual"><i class="fas fa-tag" style="color:#2563eb;"></i>Dijual</a>
      <a href="properti.html?listing=disewa"><i class="fas fa-key" style="color:#16a34a;"></i>Disewa</a>
      <a href="kpr.html"><i class="fas fa-calculator" style="color:#7c3aed;"></i>Simulasi KPR</a>
      <a href="artikel.html"><i class="fas fa-newspaper" style="color:#ea580c;"></i>Artikel</a>
    </div>
    <div class="mobile-menu-footer" id="navAuthMobileFooter"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="checkLightboxClose(event)">
  <button class="lightbox-nav prev" onclick="event.stopPropagation();prevPhoto()"><i class="fas fa-chevron-left"></i></button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-nav next" onclick="event.stopPropagation();nextPhoto()"><i class="fas fa-chevron-right"></i></button>
  <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
  <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
</div>

<!-- MAIN CONTENT -->
<div class="container" style="padding-top:20px;padding-bottom:32px;" id="mainContent">

  <!-- Loading -->
  <div id="loadingState">
    <div class="skeleton" style="height:16px;width:300px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:340px;border-radius:16px;margin-bottom:24px;"></div>
    <div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div>
    <div class="skeleton" style="height:20px;width:40%;"></div>
  </div>

  <!-- Content -->
  <div id="propertyContent" class="hidden fade-in"></div>

  <!-- Not Found -->
  <div id="notFoundState" class="hidden empty-state">
    <div class="empty-state-icon">🏠</div>
    <div class="empty-state-title">Properti Tidak Ditemukan</div>
    <div class="empty-state-desc">Properti yang Anda cari mungkin telah dihapus atau tidak tersedia.</div>
    <a href="properti.html" class="btn btn-primary">Cari Properti Lain</a>
  </div>
</div>

<!-- MOBILE CONTACT BAR (injected by JS) -->
<div class="mobile-contact-bar" id="mobileContactBar" style="display:none;">
  <a id="mobileWABtn" href="#" class="contact-btn" style="flex:1;background:#25D366;color:white;"><i class="fab fa-whatsapp"></i>WhatsApp</a>
  <button id="mobileFavBtn" onclick="toggleDetailFav()" class="contact-btn" style="flex:0 0 auto;width:52px;background:#f3f4f6;color:#6b7280;border-radius:12px;border:1.5px solid #e5e7eb;"><i class="fas fa-heart"></i></button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let currentProp = null;
let lightboxIndex = 0;
let mapInstance = null;

// Load property
function loadProperty() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const slug = params.get('slug');

  if (typeof RUMAHKITA_PROPERTIES === 'undefined') {
    setTimeout(loadProperty, 100); return;
  }

  let prop = null;
  if (id) prop = RUMAHKITA_PROPERTIES.find(p => p.id === id);
  else if (slug) prop = RUMAHKITA_PROPERTIES.find(p => p.slug === slug);
  else prop = RUMAHKITA_PROPERTIES[0];

  document.getElementById('loadingState').style.display = 'none';

  if (!prop) {
    document.getElementById('notFoundState').classList.remove('hidden');
    return;
  }

  currentProp = prop;
  document.title = prop.title + ' - RumahKita';
  document.querySelector('meta[name="description"]').content = prop.description?.slice(0, 160) || '';

  renderProperty(prop);
  document.getElementById('propertyContent').classList.remove('hidden');

  // Mobile contact bar
  const mobileBar = document.getElementById('mobileContactBar');
  mobileBar.style.display = 'flex';
  document.getElementById('mobileWABtn').href = `https://wa.me/${prop.user?.whatsapp}?text=Halo, saya tertarik dengan properti: ${prop.title}`;
  updateMobileFavBtn();
}

function renderProperty(prop) {
  const imgs = prop.images || ['https://picsum.photos/seed/'+prop.id+'/800/600'];
  const isFav = Favorites.has(prop.id);
  const isJual = prop.listing === 'dijual';
  const priceLabel = !isJual ? (prop.price_type === 'monthly' ? '/bulan' : '/tahun') : '';

  const content = `
  <!-- Breadcrumb -->
  <nav style="font-size:13px;color:#6b7280;margin-bottom:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
    <a href="index.html" style="color:#6b7280;" onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#6b7280'">Beranda</a>
    <i class="fas fa-chevron-right" style="font-size:10px;"></i>
    <a href="properti.html" style="color:#6b7280;" onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#6b7280'">Properti</a>
    <i class="fas fa-chevron-right" style="font-size:10px;"></i>
    <span style="color:#111827;font-weight:500;" class="line-clamp-1">${prop.title}</span>
  </nav>

  <!-- Gallery -->
  <div class="gallery-grid" style="margin-bottom:24px;">
    <div class="gallery-main">
      <img src="${imgs[0]}" alt="${prop.title}" onclick="openLightbox(0)" onerror="this.src='https://picsum.photos/seed/${prop.id}/800/600'">
    </div>
    ${imgs[1] ? `<div class="gallery-thumb"><img src="${imgs[1]}" alt="" onclick="openLightbox(1)" onerror="this.src='https://picsum.photos/seed/${prop.id}b/800/600'"></div>` : ''}
    ${imgs[2] ? `<div class="gallery-thumb" style="position:relative;">
      <img src="${imgs[2]}" alt="" onclick="openLightbox(2)" onerror="this.src='https://picsum.photos/seed/${prop.id}c/800/600'">
      ${imgs.length > 3 ? `<div class="gallery-more-overlay" onclick="openLightbox(2)"><span>+${imgs.length - 3} foto</span></div>` : ''}
    </div>` : ''}
  </div>

  <!-- Title + Share Row -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
    <div style="flex:1;min-width:0;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <span class="card-badge ${isJual?'badge-jual':'badge-sewa'}" style="font-size:12px;padding:4px 12px;border-radius:8px;">${isJual?'Dijual':'Disewa'}</span>
        ${prop.is_featured ? '<span class="card-badge badge-unggulan" style="font-size:12px;padding:4px 12px;border-radius:8px;">⭐ Unggulan</span>' : ''}
        ${prop.is_negotiable ? '<span style="font-size:12px;font-weight:600;color:#7c3aed;background:#f5f3ff;padding:4px 10px;border-radius:8px;">Harga Nego</span>' : ''}
      </div>
      <h1 style="font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800;color:#111827;line-height:1.3;margin-bottom:8px;">${prop.title}</h1>
      <div style="display:flex;align-items:center;gap:6px;color:#6b7280;font-size:14px;">
        <i class="fas fa-map-marker-alt" style="color:#2563eb;"></i>
        <span>${prop.address || `${prop.district}, ${prop.city}`}</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;">
      <button class="share-btn" onclick="shareProperty()"><i class="fas fa-share-alt"></i>Bagikan</button>
      <button id="favBtn" class="share-btn ${isFav?'active':''}" onclick="toggleDetailFav()" style="${isFav?'color:#ef4444;border-color:#ef4444;':''}" title="Simpan">
        <i class="fas fa-heart" style="${isFav?'color:#ef4444;':''}"></i>${isFav?'Tersimpan':'Simpan'}
      </button>
    </div>
  </div>

  <!-- Price -->
  <div style="background:#eff6ff;border-radius:16px;padding:20px;margin-bottom:24px;">
    <div style="font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;color:#2563eb;line-height:1;">${Fmt.price(prop.price)}${priceLabel ? `<span style="font-size:16px;font-weight:400;color:#6b7280;">${priceLabel}</span>` : ''}</div>
    ${prop.land_area ? `<div style="font-size:14px;color:#374151;margin-top:6px;">Rp ${Fmt.number(Math.round(prop.price / prop.land_area))}/m² · Luas Tanah ${prop.land_area}m²</div>` : ''}
  </div>

  <div class="detail-layout">
    <!-- LEFT COLUMN -->
    <div>
      <!-- Specs Grid -->
      <div style="background:white;border-radius:16px;border:1px solid #f3f4f6;padding:20px;margin-bottom:20px;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:16px;color:#111827;">Spesifikasi Properti</h2>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;" id="specsGrid">
          ${prop.bedrooms ? `<div class="spec-box"><div class="icon">🛏️</div><div class="label">Kamar Tidur</div><div class="value">${prop.bedrooms}</div></div>` : ''}
          ${prop.bathrooms ? `<div class="spec-box"><div class="icon">🚿</div><div class="label">Kamar Mandi</div><div class="value">${prop.bathrooms}</div></div>` : ''}
          ${prop.building_area ? `<div class="spec-box"><div class="icon">📐</div><div class="label">Luas Bangunan</div><div class="value">${prop.building_area}m²</div></div>` : ''}
          ${prop.land_area ? `<div class="spec-box"><div class="icon">🌿</div><div class="label">Luas Tanah</div><div class="value">${prop.land_area}m²</div></div>` : ''}
          ${prop.floors ? `<div class="spec-box"><div class="icon">🏢</div><div class="label">Lantai</div><div class="value">${prop.floors}</div></div>` : ''}
          ${prop.garage ? `<div class="spec-box"><div class="icon">🚗</div><div class="label">Garasi</div><div class="value">${prop.garage}</div></div>` : ''}
          ${prop.year_built ? `<div class="spec-box"><div class="icon">📅</div><div class="label">Tahun Dibangun</div><div class="value">${prop.year_built}</div></div>` : ''}
          ${prop.certificate ? `<div class="spec-box"><div class="icon">📄</div><div class="label">Sertifikat</div><div class="value">${prop.certificate}</div></div>` : ''}
          ${prop.furnished ? `<div class="spec-box"><div class="icon">🛋️</div><div class="label">Furnitur</div><div class="value" style="font-size:13px;">${prop.furnished==='furnished'?'Full Furnished':prop.furnished==='semi'?'Semi Furnished':'Unfurnished'}</div></div>` : ''}
        </div>
      </div>

      <!-- Description -->
      <div style="background:white;border-radius:16px;border:1px solid #f3f4f6;padding:20px;margin-bottom:20px;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;color:#111827;">Deskripsi Properti</h2>
        <div id="descText" style="font-size:14px;color:#374151;line-height:1.8;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;">${prop.description}</div>
        <button onclick="toggleDesc()" id="descToggle" style="margin-top:10px;font-size:13px;color:#2563eb;background:none;border:none;cursor:pointer;font-weight:600;padding:0;font-family:inherit;">Selengkapnya ↓</button>
      </div>

      <!-- Features -->
      ${prop.features?.length ? `
      <div style="background:white;border-radius:16px;border:1px solid #f3f4f6;padding:20px;margin-bottom:20px;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;color:#111827;">Fasilitas & Fitur</h2>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;">
          ${prop.features.map(f => `<div class="feature-check"><i class="fas fa-check-circle" style="color:#2563eb;font-size:13px;flex-shrink:0;"></i>${f}</div>`).join('')}
        </div>
      </div>` : ''}

      <!-- Map -->
      <div style="background:white;border-radius:16px;border:1px solid #f3f4f6;padding:20px;margin-bottom:20px;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;color:#111827;"><i class="fas fa-map-marker-alt" style="color:#2563eb;margin-right:8px;"></i>Lokasi</h2>
        <div id="map"></div>
        <div style="margin-top:12px;padding:12px;background:#f9fafb;border-radius:10px;">
          <div style="font-size:13px;color:#374151;"><i class="fas fa-map-marker-alt" style="color:#2563eb;margin-right:6px;"></i>${prop.address || `${prop.district}, ${prop.city}, ${prop.province}`}</div>
        </div>
        <a href="https://www.google.com/maps?q=${prop.lat},${prop.lng}" target="_blank" rel="noopener" class="btn btn-gray btn-sm" style="margin-top:12px;font-size:13px;"><i class="fas fa-external-link-alt"></i>Buka di Google Maps</a>
      </div>

      <!-- KPR Estimate -->
      ${isJual ? `
      <div style="background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:16px;padding:20px;margin-bottom:20px;color:white;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;"><i class="fas fa-calculator" style="margin-right:8px;"></i>Estimasi KPR</h2>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;">
          <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:14px;">
            <div style="font-size:10px;color:#bfdbfe;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Cicilan/Bln</div>
            <div id="kprEstimate" style="font-size:18px;font-weight:800;"></div>
          </div>
          <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:14px;">
            <div style="font-size:10px;color:#bfdbfe;text-transform:uppercase;font-weight:600;margin-bottom:4px;">DP 30%</div>
            <div style="font-size:18px;font-weight:800;">${Fmt.price(Math.round(prop.price * 0.3))}</div>
          </div>
          <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:14px;">
            <div style="font-size:10px;color:#bfdbfe;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Pokok KPR</div>
            <div style="font-size:18px;font-weight:800;">${Fmt.price(Math.round(prop.price * 0.7))}</div>
          </div>
        </div>
        <div style="font-size:11px;color:#93c5fd;margin-top:10px;text-align:center;">*Estimasi KPR 20 tahun, bunga 9%/tahun</div>
        <a href="kpr.html?price=${prop.price}" class="btn" style="background:white;color:#1d4ed8;margin-top:12px;font-weight:700;width:100%;"><i class="fas fa-calculator"></i>Hitung Detail KPR</a>
      </div>` : ''}

      <!-- Similar -->
      <div>
        <h2 style="font-size:17px;font-weight:800;color:#111827;margin-bottom:16px;">Properti Serupa</h2>
        <div class="similar-grid" id="similarProps"></div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div>
      <!-- Agent Card -->
      <div class="agent-card sticky-sidebar" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div class="user-avatar" style="width:52px;height:52px;font-size:18px;flex-shrink:0;">
            ${prop.user?.avatar ? `<img src="${prop.user.avatar}" alt="${prop.user.name}" onerror="this.parentElement.textContent='${Fmt.initials(prop.user?.name||'A')}'">` : Fmt.initials(prop.user?.name||'Agen')}
          </div>
          <div>
            <div style="font-weight:700;font-size:15px;color:#111827;">${prop.user?.name || 'Agen RumahKita'}</div>
            <div style="font-size:12px;color:#2563eb;font-weight:600;">${prop.user?.type === 'agen' ? '✓ Agen Terverifikasi' : 'Pemilik Langsung'}</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:2px;">
              ${prop.user?.active_listings ? `${prop.user.active_listings} listing aktif` : ''}
              ${prop.user?.member_since ? ` · Sejak ${prop.user.member_since.split('-')[0]}` : ''}
            </div>
          </div>
        </div>

        <!-- Contact Buttons -->
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
          <a href="https://wa.me/${prop.user?.whatsapp}?text=${encodeURIComponent('Halo, saya tertarik dengan properti: '+prop.title+' ('+window.location.href+')')}" target="_blank" rel="noopener" class="contact-btn" style="background:#25D366;color:white;">
            <i class="fab fa-whatsapp" style="font-size:18px;"></i>Chat WhatsApp
          </a>
          <a href="tel:${prop.user?.phone}" class="contact-btn" style="background:white;border:2px solid #2563eb;color:#2563eb;">
            <i class="fas fa-phone"></i>Hubungi Agen
          </a>
        </div>

        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;padding:12px;background:#f9fafb;border-radius:12px;">
          <div>
            <div style="font-size:16px;font-weight:800;color:#111827;">${Fmt.number(prop.views)}</div>
            <div style="font-size:10px;color:#6b7280;font-weight:500;">Dilihat</div>
          </div>
          <div>
            <div style="font-size:16px;font-weight:800;color:#111827;">${Fmt.timeAgo(prop.updated_at)}</div>
            <div style="font-size:10px;color:#6b7280;font-weight:500;">Update</div>
          </div>
          <div>
            <div style="font-size:16px;font-weight:800;color:#111827;">${prop.certificate || '-'}</div>
            <div style="font-size:10px;color:#6b7280;font-weight:500;">Sertifikat</div>
          </div>
        </div>

        <!-- Inquiry Form -->
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #f3f4f6;">
          <div style="font-size:13px;font-weight:700;color:#111827;margin-bottom:10px;">Kirim Pesan ke Agen</div>
          <textarea id="msgText" rows="3" placeholder="Halo, saya tertarik dengan properti ini. Apakah masih tersedia?" style="width:100%;padding:10px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;resize:none;outline:none;font-family:inherit;transition:border-color 0.2s;" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'"></textarea>
          <button onclick="sendMessage()" class="btn btn-primary btn-full" style="margin-top:10px;font-size:13px;"><i class="fas fa-paper-plane"></i>Kirim Pesan</button>
        </div>
      </div>

      <!-- Safety Tips -->
      <div style="background:#fefce8;border:1.5px solid #fef08a;border-radius:14px;padding:16px;">
        <div style="font-weight:700;font-size:13px;color:#854d0e;margin-bottom:8px;"><i class="fas fa-shield-alt" style="margin-right:6px;"></i>Tips Keamanan Bertransaksi</div>
        <ul style="font-size:12px;color:#713f12;list-style:none;display:flex;flex-direction:column;gap:5px;">
          <li>✓ Kunjungi properti secara langsung sebelum membeli</li>
          <li>✓ Verifikasi keaslian dokumen sertifikat</li>
          <li>✓ Gunakan PPJB untuk perlindungan transaksi</li>
          <li>✓ Konsultasikan dengan notaris terpercaya</li>
        </ul>
      </div>
    </div>
  </div>`;

  document.getElementById('propertyContent').innerHTML = content;

  // KPR estimate
  if (isJual) {
    const pokok = prop.price * 0.7;
    const r = 0.09 / 12, n = 240;
    const cicilan = (pokok * r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
    const el = document.getElementById('kprEstimate');
    if (el) el.textContent = Fmt.price(Math.round(cicilan));
  }

  // Init map
  setTimeout(() => initMap(prop), 300);

  // Render similar
  renderSimilar(prop);
}

function initMap(prop) {
  if (!prop.lat || !prop.lng) return;
  const mapEl = document.getElementById('map');
  if (!mapEl || typeof L === 'undefined') return;
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapInstance = L.map('map').setView([prop.lat, prop.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(mapInstance);
  const icon = L.divIcon({
    html: `<div style="background:#2563eb;border:3px solid white;border-radius:50%;width:16px;height:16px;box-shadow:0 2px 10px rgba(37,99,235,0.5);"></div>`,
    className: '', iconSize: [16, 16], iconAnchor: [8, 8]
  });
  L.marker([prop.lat, prop.lng], { icon }).addTo(mapInstance)
    .bindPopup(`<div style="font-weight:600;font-size:13px;max-width:180px;">${prop.title}</div><div style="font-size:12px;color:#374151;margin-top:2px;">${Fmt.price(prop.price)}</div>`)
    .openPopup();
}

function renderSimilar(prop) {
  if (typeof RUMAHKITA_PROPERTIES === 'undefined') return;
  const similar = RUMAHKITA_PROPERTIES.filter(p => p.id !== prop.id && (p.type === prop.type || p.city === prop.city)).slice(0, 3);
  const container = document.getElementById('similarProps');
  if (!container) return;
  if (!similar.length) { container.closest('div').style.display = 'none'; return; }
  container.innerHTML = similar.map(p => renderPropertyCard(p)).join('');
}

// Lightbox
function openLightbox(idx) {
  if (!currentProp) return;
  const imgs = currentProp.images || [];
  if (!imgs.length) return;
  lightboxIndex = idx;
  const lb = document.getElementById('lightbox');
  lb.classList.add('open');
  updateLightbox();
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const imgs = currentProp?.images || [];
  const img = document.getElementById('lightboxImg');
  const counter = document.getElementById('lightboxCounter');
  if (img) img.src = imgs[lightboxIndex] || '';
  if (counter) counter.textContent = `${lightboxIndex + 1} / ${imgs.length}`;
}

function nextPhoto() { const imgs = currentProp?.images || []; lightboxIndex = (lightboxIndex + 1) % imgs.length; updateLightbox(); }
function prevPhoto() { const imgs = currentProp?.images || []; lightboxIndex = (lightboxIndex - 1 + imgs.length) % imgs.length; updateLightbox(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
function checkLightboxClose(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); }

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') nextPhoto();
  else if (e.key === 'ArrowLeft') prevPhoto();
  else if (e.key === 'Escape') closeLightbox();
});

// Desc toggle
let descExpanded = false;
function toggleDesc() {
  descExpanded = !descExpanded;
  const el = document.getElementById('descText');
  const btn = document.getElementById('descToggle');
  if (el) { el.style.webkitLineClamp = descExpanded ? 'unset' : '5'; el.style.overflow = descExpanded ? 'visible' : 'hidden'; }
  if (btn) btn.textContent = descExpanded ? 'Lebih sedikit ↑' : 'Selengkapnya ↓';
}

// Fav
function toggleDetailFav() {
  if (!currentProp) return;
  const isNowFav = Favorites.toggle(currentProp.id);
  const btn = document.getElementById('favBtn');
  const mobileBtn = document.getElementById('mobileFavBtn');
  if (btn) {
    btn.classList.toggle('active', isNowFav);
    btn.innerHTML = `<i class="fas fa-heart" style="${isNowFav?'color:#ef4444;':''}"></i>${isNowFav?'Tersimpan':'Simpan'}`;
    btn.style.color = isNowFav ? '#ef4444' : '';
    btn.style.borderColor = isNowFav ? '#ef4444' : '';
  }
  updateMobileFavBtn();
}

function updateMobileFavBtn() {
  if (!currentProp) return;
  const isFav = Favorites.has(currentProp.id);
  const mobileBtn = document.getElementById('mobileFavBtn');
  if (mobileBtn) {
    mobileBtn.innerHTML = `<i class="fas fa-heart" style="font-size:18px;${isFav?'color:#ef4444;':'color:#6b7280;'}"></i>`;
    mobileBtn.style.background = isFav ? '#fef2f2' : '#f3f4f6';
  }
}

// Share
function shareProperty() {
  if (navigator.share) {
    navigator.share({ title: currentProp?.title || '', url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(window.location.href);
    Toast.success('Link berhasil disalin!');
  }
}

// Message
function sendMessage() {
  const msg = document.getElementById('msgText')?.value?.trim();
  if (!msg) { Toast.warning('Tulis pesan terlebih dahulu'); return; }
  Toast.success('Pesan berhasil dikirim ke agen!');
  document.getElementById('msgText').value = '';
}

// INIT
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(loadProperty, 100);
});
</script>
</body>
</html>
