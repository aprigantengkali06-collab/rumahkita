<script>
const ALL_ARTICLES = [
  { id:'a1', title:'10 Tips Membeli Rumah Pertama untuk Milenial', category:'Tips Beli', date:'2026-03-20', readTime:'5 min', image:'https://picsum.photos/seed/art001/1200/600', author:'Dina Pratiwi', views:3240,
    content:`<h2>Mengapa Membeli Rumah adalah Keputusan Besar</h2><p>Membeli rumah pertama adalah salah satu keputusan finansial terbesar dalam hidup Anda. Bagi generasi milenial, tantangan ini semakin kompleks dengan harga properti yang terus naik dan kondisi ekonomi yang dinamis.</p><blockquote>Rumah bukan hanya investasi finansial, tapi investasi untuk kualitas hidup Anda dan keluarga.</blockquote><h2>10 Tips yang Wajib Anda Ketahui</h2><h3>1. Tentukan Budget Secara Realistis</h3><p>Sebelum mulai mencari, hitung kemampuan finansial Anda dengan jujur. Cicilan KPR idealnya tidak melebihi 30% pendapatan bulanan. Jangan lupa biaya tambahan seperti PPN, BPHTB, dan biaya notaris.</p><h3>2. Siapkan Dana DP Sejak Dini</h3><p>Down payment minimal 10-30% dari harga properti. Mulai menabung secara konsisten dan pertimbangkan instrumen investasi yang sesuai untuk mengembangkan dana DP Anda.</p><div class="tip-box"><strong>💡 Tips:</strong> Manfaatkan program tabungan berencana di bank atau reksa dana pasar uang untuk menyimpan dana DP dengan lebih efisien.</div><h3>3. Pilih Lokasi yang Strategis</h3><p>Lokasi adalah faktor paling penting dalam investasi properti. Pertimbangkan akses transportasi, fasilitas umum, sekolah, dan potensi perkembangan kawasan di masa depan.</p><h3>4. Cek Legalitas Properti</h3><p>Pastikan sertifikat tanah asli (SHM lebih baik daripada HGB), perizinan bangunan (IMB/PBG), dan tidak ada sengketa kepemilikan. Konsultasikan dengan notaris terpercaya.</p><h3>5. Survey Fisik Bangunan</h3><p>Kunjungi properti minimal 2-3 kali pada waktu berbeda. Periksa kondisi struktur, instalasi listrik, saluran air, dan potensi masalah yang tersembunyi.</p><h3>6. Negosiasi Harga</h3><p>Harga yang tercantum bukan harga final. Pelajari harga pasaran kawasan tersebut dan ajukan penawaran yang reasonable. Seller yang termotivasi biasanya bersedia nego 5-15%.</p><h3>7. Manfaatkan KPR Subsidi</h3><p>Jika memenuhi syarat, KPR FLPP/subsidi bisa menjadi pilihan dengan bunga lebih rendah dan cicilan lebih ringan. Cek eligibilitas Anda di bank penyalur.</p><h3>8. Persiapkan Dokumen Lengkap</h3><p>KTP, NPWP, slip gaji 3 bulan terakhir, rekening koran, dan dokumen pendukung lainnya. Kelengkapan dokumen mempercepat proses KPR.</p><h3>9. Pilih Developer Terpercaya</h3><p>Riset reputasi developer, cek proyek sebelumnya, dan baca review dari penghuni. Developer terpercaya memiliki track record yang baik dan tidak memiliki masalah hukum.</p><h3>10. Jangan Terburu-Buru</h3><p>Beli properti adalah komitmen jangka panjang. Luangkan waktu untuk riset, pertimbangkan dengan matang, dan jangan terpengaruh pressure dari agen atau developer.</p>` },
  { id:'a2', title:'Panduan Lengkap KPR: Syarat, Proses, dan Kalkulasi', category:'KPR', date:'2026-03-18', readTime:'8 min', image:'https://picsum.photos/seed/art002/1200/600', author:'Rizky Pratama', views:5120,
    content:`<h2>Apa itu KPR?</h2><p>KPR (Kredit Pemilikan Rumah) adalah fasilitas kredit yang diberikan oleh bank atau lembaga keuangan untuk membantu Anda membeli properti dengan cara mencicil dalam jangka waktu tertentu.</p><h2>Syarat Pengajuan KPR</h2><h3>Persyaratan Umum</h3><ul><li>WNI berusia 21-55 tahun (saat lunas max 65 tahun)</li><li>Karyawan tetap minimal 2 tahun</li><li>Penghasilan tetap yang dapat diverifikasi</li><li>Tidak memiliki kredit bermasalah (BI Checking bersih)</li></ul><h3>Dokumen yang Diperlukan</h3><ul><li>KTP dan KK</li><li>NPWP</li><li>Slip gaji 3 bulan terakhir</li><li>Rekening koran 3 bulan terakhir</li><li>Surat keterangan kerja</li><li>Dokumen properti dari developer/penjual</li></ul><h2>Cara Menghitung Cicilan KPR</h2><p>Rumus cicilan KPR menggunakan sistem anuitas:</p><blockquote>Cicilan = P × [r(1+r)ⁿ] / [(1+r)ⁿ-1]<br>P = Pokok pinjaman, r = Bunga bulanan, n = Jumlah bulan</blockquote><div class="tip-box"><strong>💡 Contoh:</strong> Pinjaman Rp 700 juta, bunga 9%/tahun, tenor 20 tahun → Cicilan ≈ Rp 6,3 juta/bulan</div><h2>Tips Mendapatkan KPR Terbaik</h2><ul><li>Bandingkan penawaran minimal 3-5 bank</li><li>Perhatikan perbedaan bunga fixed vs floating</li><li>Hitung total biaya termasuk provisi, asuransi, dan administrasi</li><li>Negosiasikan tenure dan suku bunga</li></ul>` },
  { id:'a3', title:'Investasi Properti di Era Digital: Peluang & Tantangan', category:'Investasi', date:'2026-03-15', readTime:'6 min', image:'https://picsum.photos/seed/art003/1200/600', author:'Budi Santoso', views:2890,
    content:`<h2>Revolusi Digital di Dunia Properti</h2><p>Era digital telah mengubah cara kita berinvestasi di properti. Dari platform proptech hingga crowdfunding, peluang baru terus bermunculan bagi investor modern.</p><h2>Peluang Investasi Properti Digital</h2><h3>1. Proptech Platforms</h3><p>Platform seperti RumahKita memungkinkan Anda mencari, menganalisis, dan bertransaksi properti secara online dengan lebih efisien dan transparan.</p><h3>2. Properti Crowdfunding</h3><p>Berinvestasi properti dengan modal kecil bersama banyak investor. Potensi return yang menarik dengan risiko yang tersebar.</p><h3>3. REIT (Real Estate Investment Trust)</h3><p>Investasi properti melalui pasar modal dengan likuiditas lebih tinggi. Cocok untuk investor yang ingin diversifikasi portofolio.</p><h2>Tantangan yang Perlu Diwaspadai</h2><ul><li>Regulasi yang terus berkembang</li><li>Risiko platform yang belum terbukti</li><li>Volatilitas harga di beberapa segmen</li><li>Kurangnya transparansi data</li></ul><blockquote>Diversifikasi adalah kunci investasi properti yang bijak di era digital.</blockquote>` },
  { id:'a4', title:'SHM vs HGB: Perbedaan dan Mana yang Lebih Baik?', category:'Hukum', date:'2026-03-12', readTime:'4 min', image:'https://picsum.photos/seed/art004/1200/600', author:'Sari Hukum', views:1750,
    content:`<h2>Jenis-Jenis Sertifikat Properti di Indonesia</h2><p>Memahami jenis sertifikat properti sangat penting sebelum melakukan transaksi jual beli atau KPR. Dua yang paling umum adalah SHM dan HGB.</p><h2>SHM (Sertifikat Hak Milik)</h2><p>SHM adalah status kepemilikan tanah tertinggi di Indonesia. Pemilik memiliki hak penuh atas tanah tanpa batas waktu.</p><div class="tip-box"><strong>Kelebihan SHM:</strong> Hak kepemilikan penuh, tidak ada batas waktu, mudah dijaminkan ke bank, nilai jual lebih tinggi.</div><h2>HGB (Hak Guna Bangunan)</h2><p>HGB memberikan hak untuk mendirikan dan menggunakan bangunan di atas tanah selama jangka waktu tertentu (max 30 tahun, dapat diperpanjang).</p><h3>Kapan HGB Digunakan?</h3><ul><li>Properti di kawasan perumahan tertentu</li><li>Apartemen dan kondotel</li><li>Properti di kawasan khusus atau reklamasi</li><li>Properti yang dimiliki badan hukum</li></ul><h2>Kesimpulan</h2><p>Untuk properti residensial jangka panjang, SHM lebih disarankan. HGB masih aman selama Anda memperhatikan masa berlakunya dan proses perpanjangan.` },
  { id:'a5', title:'Desain Rumah Minimalis Modern 2026: Tren & Inspirasi', category:'Desain', date:'2026-03-10', readTime:'5 min', image:'https://picsum.photos/seed/art005/1200/600', author:'Lina Desain', views:4230,
    content:`<h2>Tren Desain Rumah 2026</h2><p>Desain rumah terus berevolusi mengikuti gaya hidup modern yang dinamis. Tahun 2026, beberapa tren desain minimalis mendominasi pasar properti Indonesia.</p><h2>Prinsip Desain Minimalis Modern</h2><ul><li>Less is more — fokus pada fungsionalitas</li><li>Ruang terbuka dan pencahayaan alami maksimal</li><li>Material natural: kayu, batu, beton ekspos</li><li>Palet warna netral dengan aksen berani</li><li>Integrasi teknologi smart home</li></ul><h2>Tren 2026 yang Populer</h2><h3>Biophilic Design</h3><p>Mengintegrasikan elemen alam ke dalam interior — tanaman indoor, dinding hijau, dan material organik. Menciptakan suasana segar dan menenangkan.</p><h3>Multifunctional Spaces</h3><p>Ruang yang dapat difungsikan ganda sangat relevan untuk rumah di kota besar. Ruang keluarga yang bisa jadi home office, atau ruang tidur yang bisa jadi ruang kerja.</p><blockquote>Desain terbaik adalah yang membuat penghuninya merasa nyaman dan produktif setiap hari.</blockquote>` },
  { id:'a9', title:'KPR Subsidi FLPP 2026: Siapa yang Berhak?', category:'KPR', date:'2026-02-28', readTime:'5 min', image:'https://picsum.photos/seed/art009/1200/600', author:'Budi Santoso', views:6200,
    content:`<h2>Apa itu KPR FLPP?</h2><p>Fasilitas Likuiditas Pembiayaan Perumahan (FLPP) adalah program pemerintah untuk memberikan kemudahan KPR bagi Masyarakat Berpenghasilan Rendah (MBR) dengan bunga subsidi dan cicilan terjangkau.</p><h2>Siapa yang Berhak?</h2><ul><li>WNI berusia min. 21 tahun atau sudah menikah</li><li>Belum pernah menerima KPR subsidi sebelumnya</li><li>Belum memiliki rumah atau hunian sendiri</li><li>Penghasilan maksimal Rp 8 juta/bulan</li><li>Bekerja minimal 1 tahun</li></ul><div class="tip-box"><strong>🏠 Plafon KPR FLPP 2026:</strong> Harga rumah max Rp 200-300 juta (tergantung zona), bunga 5%/tahun flat, tenor max 20 tahun.</div><h2>Cara Daftar KPR FLPP</h2><ol><li>Siapkan dokumen persyaratan</li><li>Pilih rumah subsidi dari developer terdaftar</li><li>Ajukan ke bank penyalur (BTN, BRI, Mandiri, dll)</li><li>Proses verifikasi oleh Pusat Pengelolaan Dana Pembiayaan Perumahan (PPDPP)</li><li>Penandatanganan akad kredit</li></ol>` },
];

function loadArticle() {
  const id = new URLSearchParams(window.location.search).get('id') || 'a1';
  const article = ALL_ARTICLES.find(a => a.id === id);
  document.getElementById('loadingState').style.display = 'none';
  if (!article) { document.getElementById('notFoundState').classList.remove('hidden'); return; }
  document.title = article.title + ' - RumahKita';
  document.querySelector('meta[name="description"]').content = article.title;

  // Related articles
  const related = ALL_ARTICLES.filter(a => a.id !== id && (a.category === article.category || Math.random() > 0.5)).slice(0, 3);

  document.getElementById('articleContent').innerHTML = `

  <nav style="font-size:13px;color:#6b7280;margin-bottom:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
    <a href="index.html" style="color:#6b7280;" onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#6b7280'">Beranda</a>
    <i class="fas fa-chevron-right" style="font-size:10px;"></i>
    <a href="artikel.html" style="color:#6b7280;" onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#6b7280'">Artikel</a>
    <i class="fas fa-chevron-right" style="font-size:10px;"></i>
    <span style="color:#111827;">${article.category}</span>
  </nav>

  <div class="article-layout">
    <!-- MAIN -->
    <article>
      <!-- Category -->
      <div style="margin-bottom:14px;">
        <span style="font-size:12px;font-weight:700;color:#2563eb;background:#eff6ff;padding:4px 12px;border-radius:20px;">${article.category}</span>
      </div>
      <!-- Title -->
      <h1 style="font-size:clamp(1.4rem,4vw,2rem);font-weight:800;color:#111827;line-height:1.35;margin-bottom:14px;">${article.title}</h1>
      <!-- Meta -->
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#6b7280;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f3f4f6;">
        <span style="display:flex;align-items:center;gap:6px;">
          <div class="user-avatar" style="width:28px;height:28px;font-size:11px;">${Fmt.initials(article.author)}</div>
          ${article.author}
        </span>
        <span><i class="fas fa-calendar-alt" style="margin-right:4px;"></i>${Fmt.date(article.date)}</span>
        <span><i class="fas fa-clock" style="margin-right:4px;"></i>${article.readTime} baca</span>
        <span><i class="fas fa-eye" style="margin-right:4px;"></i>${Fmt.number(article.views)} dibaca</span>
      </div>
      <!-- Hero Image -->
      <div style="border-radius:16px;overflow:hidden;margin-bottom:28px;height:340px;">
        <img src="${article.image}" alt="${article.title}" style="width:100%;height:100%;object-fit:cover;" loading="lazy">
      </div>
      <!-- Body -->
      <div class="article-body">${article.content}</div>
      <!-- Share -->
      <div style="margin-top:32px;padding-top:24px;border-top:1px solid #f3f4f6;">
        <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:12px;">Bagikan artikel ini:</div>
        <div class="share-row">
          <button class="share-social" style="background:#1877f2;color:white;" onclick="shareArticle('facebook')"><i class="fab fa-facebook-f"></i>Facebook</button>
          <button class="share-social" style="background:#25D366;color:white;" onclick="shareArticle('whatsapp')"><i class="fab fa-whatsapp"></i>WhatsApp</button>
          <button class="share-social" style="background:#1DA1F2;color:white;" onclick="shareArticle('twitter')"><i class="fab fa-twitter"></i>Twitter</button>
          <button class="share-social" style="background:#f3f4f6;color:#374151;" onclick="copyLink()"><i class="fas fa-link"></i>Salin Link</button>
        </div>
      </div>
    </article>

    <!-- SIDEBAR -->
    <aside>
      <!-- Related -->
      <div class="card" style="position:sticky;top:88px;">
        <div class="card-header">Artikel Terkait</div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:12px;">
          ${related.map(r => `
          <a href="artikel-detail.html?id=${r.id}" style="display:flex;gap:12px;align-items:flex-start;">
            <img src="${r.image}" alt="${r.title}" style="width:72px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;" loading="lazy">
            <div>
              <div style="font-size:11px;color:#2563eb;font-weight:600;margin-bottom:3px;">${r.category}</div>
              <div style="font-size:13px;font-weight:600;color:#111827;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${r.title}</div>
              <div style="font-size:11px;color:#9ca3af;margin-top:3px;">${r.readTime} baca</div>
            </div>
          </a>`).join('')}
        </div>
      </div>

      <!-- KPR CTA -->
      <div style="margin-top:16px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:16px;padding:20px;color:white;text-align:center;">
        <i class="fas fa-calculator" style="font-size:28px;margin-bottom:10px;opacity:0.9;display:block;"></i>
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;">Hitung KPR Anda</div>
        <div style="font-size:12px;color:#bfdbfe;margin-bottom:14px;">Estimasi cicilan instan</div>

      </div>
    </aside>
  </div>`;

  document.getElementById('articleContent').classList.remove('hidden');
}

function shareArticle(platform) {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  const urls = {
    facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
    whatsapp: `https://wa.me/?text=${title}%20${url}`,
    twitter: `https://twitter.com/intent/tweet?url=${url}&text=${title}`
  };
  window.open(urls[platform], '_blank', 'width=600,height=400');
}

function copyLink() {
  navigator.clipboard?.writeText(window.location.href);
  Toast.success('Link berhasil disalin!');
}

document.addEventListener('DOMContentLoaded', loadArticle);
</script>
